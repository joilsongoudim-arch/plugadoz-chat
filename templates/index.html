<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plugadoz</title>
    <!-- ÍCONES FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; background: #0b141a; color: #e9edef; overflow: hidden; position: fixed; }

        /* TELA DE LOGIN SIMPLES */
        #login-screen { 
            position: fixed; inset: 0; background: #111b21; display: flex; 
            justify-content: center; align-items: center; z-index: 99999; padding: 20px; 
        }
        .login-card { 
            background: #202c33; padding: 30px 20px; border-radius: 12px; 
            width: 100%; max-width: 340px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
        }
        .login-card h2 { color: #00a884; margin-bottom: 20px; font-size: 24px; }
        .login-card input { 
            width: 100%; padding: 12px 15px; background: #2a3942; border: 1px solid #374248; 
            border-radius: 8px; color: #fff; margin-bottom: 20px; outline: none; font-size: 15px; 
        }
        .login-card button { 
            width: 100%; padding: 12px; background: #00a884; color: #111b21; 
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; 
        }

        /* LAYOUT PRINCIPAL */
        .app-container { display: flex; width: 100%; height: 100%; position: relative; }
        .sidebar { width: 100%; max-width: 400px; background: #111b21; border-right: 1px solid #2a3942; display: flex; flex-direction: column; height: 100%; }
        
        /* CABEÇALHO DENTRO DO PADRÃO WHATSAPP */
        .wa-header { padding: 12px 15px; background: #111b21; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; height: 60px; }
        .wa-title { font-size: 22px; font-weight: bold; color: #00a884; }
        .wa-header-icons { display: flex; align-items: center; gap: 20px; color: #aebac1; font-size: 18px; }
        
        .tab-content { flex: 1; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222d34; cursor: pointer; }
        .chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; font-size: 20px; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 500; color: #e9edef; font-size: 16px; margin-bottom: 3px; }
        .chat-preview { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ABA DE STATUS */
        .status-section { padding: 15px; }
        .my-status { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; cursor: pointer; }
        .status-avatar { width: 48px; height: 48px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .status-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222d34; cursor: pointer; }

        /* NAVEGAÇÃO DO RODAPÉ */
        .bottom-nav { display: flex; justify-content: space-around; background: #111b21; border-top: 1px solid #222d34; padding: 8px 0; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8696a0; font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #00a884; font-weight: bold; }

        /* ÁREA DE CHAT */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; width: 100%; }
        .chat-topbar { padding: 12px 15px; background: #202c33; color: #e9edef; font-weight: bold; display: flex; align-items: center; gap: 12px; flex-shrink: 0; height: 60px; }
        
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        /* BALÕES DE MENSAGEM */
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; position: relative; line-height: 1.4; }
        .message.incoming { background: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
        .message.outgoing { background: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
        .message .sender { font-size: 11px; font-weight: bold; color: #53bdeb; margin-bottom: 3px; display: block; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .message audio { max-width: 220px; height: 36px; margin-top: 5px; display: block; }

        /* INPUT DO CHAT */
        .chat-input-area { padding: 8px 10px; background: #202c33; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; font-size: 14px; }
        .action-icon { color: #8696a0; font-size: 20px; cursor: pointer; padding: 4px; }
        .send-btn { background: #00a884; border: none; color: #111b21; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }

        @media (max-width: 768px) {
            .chat-area { display: none; }
            .app-container.chat-ativo .sidebar { display: none; }
            .app-container.chat-ativo .chat-area { display: flex; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN DIRETA -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Plugadoz</h2>
            <input type="text" id="usernameInput" placeholder="Seu nome..." autocomplete="off" onkeypress="if(event.key==='Enter') fazerLogin()">
            <button onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="wa-header">
                <span class="wa-title">Plugadoz</span>
                <div class="wa-header-icons">
                    <i class="fa-solid fa-camera" onclick="document.getElementById('statusFileInput').click()"></i>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>

            <!-- TAB CONVERSAS -->
            <div id="tab-chats" class="tab-content active">
                <div class="chat-item" onclick="abrirChat()">
                    <div class="chat-avatar"><i class="fa-solid fa-users"></i></div>
                    <div class="chat-info">
                        <div class="chat-name">ITABOA NOTÍCIAS 2026</div>
                        <div class="chat-preview" id="lastMessagePreview">Toque para abrir a conversa...</div>
                    </div>
                </div>
            </div>

            <!-- TAB ATUALIZAÇÕES -->
            <div id="tab-status" class="tab-content">
                <div class="status-section">
                    <div class="my-status" onclick="document.getElementById('statusFileInput').click()">
                        <div class="status-avatar"><i class="fa-solid fa-plus"></i></div>
                        <div>
                            <strong>Meu status</strong>
                            <div style="font-size: 12px; color: #8696a0;">Toque para postar uma foto</div>
                        </div>
                    </div>
                    <input type="file" id="statusFileInput" accept="image/*" style="display:none;" onchange="postarStatus(this)">
                    <h4 style="color: #00a884; margin-bottom: 10px;">Atualizações recentes</h4>
                    <div id="statusList"></div>
                </div>
            </div>

            <!-- RODAPÉ -->
            <div class="bottom-nav">
                <div class="nav-item active" onclick="trocarTab('chats', this)">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>Conversas</span>
                </div>
                <div class="nav-item" onclick="trocarTab('status', this)">
                    <i class="fa-solid fa-circle-notch"></i>
                    <span>Atualizações</span>
                </div>
            </div>
        </div>

        <!-- ÁREA DE CHAT -->
        <div class="chat-area">
            <div class="chat-topbar">
                <button onclick="fecharChat()" style="background:none; border:none; color:#00a884; font-size:20px; cursor:pointer;">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <span>ITABOA NOTÍCIAS 2026</span>
            </div>
            
            <div class="messages-container" id="messages"></div>
            
            <div class="chat-input-area">
                <i class="fa-solid fa-camera action-icon" onclick="document.getElementById('imageFileInput').click()"></i>
                <input type="file" id="imageFileInput" accept="image/*" style="display:none;" onchange="enviarImagem(this)">
                
                <i class="fa-solid fa-microphone action-icon" id="micBtn" onclick="toggleGravacao()"></i>
                
                <input type="text" id="messageInput" placeholder="Mensagem..." autocomplete="off" onkeypress="if(event.key==='Enter') enviarTexto()">
                <button class="send-btn" onclick="enviarTexto()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        let socket;
        let usuarioAtual = '';
        const salaAtual = 'itaboa-geral';
        let mediaRecorder;
        let audioChunks = [];
        let gravando = false;

        function fazerLogin() {
            const nomeInput = document.getElementById('usernameInput').value.trim();
            if (!nomeInput) return alert('Digite seu nome!');
            
            usuarioAtual = nomeInput;
            document.getElementById('login-screen').style.display = 'none';

            socket = io();
            socket.on('connect', () => socket.emit('join', { room: salaAtual }));
            socket.on('history', (msgs) => {
                document.getElementById('messages').innerHTML = '';
                if(Array.isArray(msgs)) msgs.forEach(renderizarMensagem);
            });
            socket.on('message', (msg) => {
                renderizarMensagem(msg);
                atualizarPreview(msg);
            });
            socket.on('status_list', (list) => {
                document.getElementById('statusList').innerHTML = '';
                if(Array.isArray(list)) list.forEach(renderizarStatus);
            });
            socket.on('new_status', renderizarStatus);
        }

        function trocarTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            el.classList.add('active');
        }

        function abrirChat() { document.getElementById('appContainer').classList.add('chat-ativo'); }
        function fecharChat() { document.getElementById('appContainer').classList.remove('chat-ativo'); }

        function enviarTexto() {
            const input = document.getElementById('messageInput');
            if (!input.value.trim()) return;
            socket.emit('message', { sender: usuarioAtual, text: input.value.trim(), room: salaAtual, type: 'text' });
            input.value = '';
        }

        function enviarImagem(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('message', { sender: usuarioAtual, image: e.target.result, room: salaAtual, type: 'image' });
            };
            reader.readAsDataURL(file);
        }

        async function toggleGravacao() {
            const micBtn = document.getElementById('micBtn');
            if (!gravando) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = e => socket.emit('message', { sender: usuarioAtual, audio: e.target.result, room: salaAtual, type: 'audio' });
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    gravando = true;
                    micBtn.style.color = '#ff4b4b';
                } catch(err) { alert('Ative a permissão do microfone para gravar.'); }
            } else {
                mediaRecorder.stop();
                gravando = false;
                micBtn.style.color = '#8696a0';
            }
        }

        function postarStatus(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('post_status', { sender: usuarioAtual, image: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        function renderizarMensagem(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (msg.sender === usuarioAtual ? 'outgoing' : 'incoming');
            
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = msg.sender || 'Usuário';
            div.appendChild(senderSpan);

            if (msg.type === 'image' || msg.image) {
                const img = document.createElement('img');
                img.src = msg.image;
                div.appendChild(img);
            } else if (msg.type === 'audio' || msg.audio) {
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = msg.audio;
                div.appendChild(audio);
            } else {
                const textNode = document.createTextNode(msg.text || '');
                div.appendChild(textNode);
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function atualizarPreview(msg) {
            const preview = document.getElementById('lastMessagePreview');
            if (msg.type === 'image' || msg.image) preview.textContent = '📷 Foto';
            else if (msg.type === 'audio' || msg.audio) preview.textContent = '🎤 Áudio de voz';
            else preview.textContent = msg.sender + ': ' + msg.text;
        }

        function renderizarStatus(st) {
            const container = document.getElementById('statusList');
            const div = document.createElement('div');
            div.className = 'status-item';
            
            const infoDiv = document.createElement('div');
            infoDiv.innerHTML = `<strong>${st.sender}</strong><div style="font-size:12px; color:#8696a0;">Novo status disponível</div>`;

            div.appendChild(infoDiv);
            div.onclick = () => {
                const w = window.open("");
                w.document.write(`<body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><img src="${st.image}" style="max-width:100%;max-height:100vh;"></body>`);
            };
            container.appendChild(div);
        }
    </script>
</body>
</html>
