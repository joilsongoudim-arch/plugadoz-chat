<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Helvetica,Arial,sans-serif}
body{background:#fff;color:#111b21}
header{background:#fff;padding:10px 14px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{color:#128c7e;font-size:24px;font-weight:800;letter-spacing:-.5px}
.top .icons{display:flex;gap:18px;font-size:22px}
.search{background:#f0f2f5;border-radius:28px;display:flex;align-items:center;padding:12px 14px;margin:8px 0 12px;gap:10px}
.search input{border:0;background:transparent;outline:none;width:100%;font-size:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;border:1px solid #e9edef;background:#fff;font-size:14px;color:#54656f;cursor:pointer}
.tab.active{background:#e7fce3;color:#128c7e;border-color:#e7fce3;font-weight:600}
.chat-list{display:flex;flex-direction:column}
.chat{ display:flex;gap:12px;padding:12px 14px;align-items:center;cursor:pointer}
.chat:active{background:#f5f6}
.chat img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.info{flex:1;min-width:0;border-bottom:1px solid #f0f2f5;padding-bottom:12px}
.top-row{display:flex;justify-content:space-between}
.nome{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hora{font-size:12px;color:#667781}
.hora.verde{color:#25d366;font-weight:600}
.msg{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.badge{background:#25d366;color:#fff;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-left:auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9edef;display:flex;justify-content:space-around;padding:8px 0 6px}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#667781;gap:2px;cursor:pointer}
.nav-item.active{color:#111b21;font-weight:600}
.nav-item span:first-child{font-size:22px}
.nav-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:14px}
.nav-item.active .nav-icon{background:#e7fce3}
.fab{position:fixed;right:18px;bottom:84px;background:#25d366;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;font-size:28px;color:#fff}

/* TELA CHAT */
#chatScreen{position:fixed;inset:0;background:#efeae2;display:none;flex-direction:column;z-index:20}
#chatHeader{background:#008069;color:#fff;padding:10px;display:flex;align-items:center;gap:10px}
#messages{flex:1;overflow-y:auto;padding:12px;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-size:contain}
.balao{max-width:78%;padding:7px 9px;border-radius:8px;margin-bottom:8px;font-size:14.5px;position:relative;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.eu{background:#d9fdd3;margin-left:auto;border-top-right-radius:0}
.outro{background:#fff;border-top-left-radius:0}
.hora-msg{font-size:10px;color:#667781;float:right;margin-left:8px;margin-top:6px}
#inputBar{background:#f0f2f5;padding:6px 8px;display:flex;align-items:center;gap:6px}
#inputBar input{flex:1;border:0;border-radius:24px;padding:12px 14px;outline:none;font-size:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border:0;cursor:pointer}
#login{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#login input{width:100%;max-width:320px;padding:14px;border-radius:28px;border:1px solid #ddd;margin-top:16px;font-size:16px}
</style>
</head>
<body>

<div id="login">
<h1 style="color:#128c7e">Plugadoz</h1>
<p>Digite seu nome para entrar</p>
<input id="nomeInput" placeholder="Seu nome">
<button onclick="entrar()" style="margin-top:12px;background:#25d366;color:#fff;border:0;padding:12px 28px;border-radius:28px;font-size:16px">Entrar</
