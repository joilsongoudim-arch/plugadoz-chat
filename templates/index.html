<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Web</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
        html, body { width: 100%; height: 100%; background: #0b141a; color: #e9edef; overflow: hidden; position: fixed; }

        /* TELA DE LOGIN */
        #login-screen { 
            position: fixed; inset: 0; background: #111b21; display: flex; 
            justify-content: center; align-items: center; z-index: 99999; padding: 20px; 
        }
        .login-card { 
            background: #202c33; padding: 35px 25px; border-radius: 8px; 
            width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
        }
        .login-card h2 { color: #00a884; margin-bottom: 24px; font-size: 26px; font-weight: 400; }
        .login-card input { 
            width: 100%; padding: 12px 16px; background: #2a3942; border: none; 
            border-radius: 4px; color: #fff; margin-bottom: 20px; outline: none; font-size: 15px; 
        }
        .login-card button { 
            width: 100%; padding: 12px; background: #00a884; color: #111b21; 
            border: none; border-radius: 4px; font-weight: 600; font-size: 15px; cursor: pointer; 
        }

        /* LAYOUT PRINCIPAL */
        .app-container { display: none; width: 100%; height: 100%; position: relative; }
        .sidebar { width: 100%; max-width: 420px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; height: 100%; }
        
        .wa-header { padding: 10px 16px; background: #202c33; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .wa-title { font-size: 20px; font-weight: 600; color: #e9edef; display: flex; align-items: center; gap: 10px; }
        .wa-header-icons { display: flex; align-items: center; gap: 20px; color: #aebac1; font-size: 18px; }
        
        .tab-pane { flex: 1; overflow-y: auto; background: #111b21; display: none; }
        .tab-pane.active { display: block; }

        .chat-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #222d34; }
        .chat-item:hover { background: #202c33; }
        .chat-avatar { width: 49px; height: 49px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 15px; flex-shrink: 0; font-size: 22px; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 400; color: #e9edef; font-size: 17px; margin-bottom: 3px; }
        .chat-preview { font-size: 14px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .bottom-nav { display: flex; justify-content: space-around; background: #111b21; border-top: 1px solid #222d34; padding: 12px 0; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8696a0; font-size: 12px; cursor: pointer; gap: 4px; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #00a884; font-weight: 600; }

        /* ÁREA DE CHAT */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; width: 100%; position: absolute; top: 0; left: 0; transform: translateX(100%); transition: transform 0.25s ease-in-out; z-index: 10; }
        .app-container.chat-ativo .chat-area { transform: translateX(0); }

        .chat-topbar { padding: 10px 16px; background: #202c33; color: #e9edef; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; height: 60px; border-left: 1px solid #222d34; }
        .chat-topbar-left { display: flex; align-items: center; gap: 15px; }
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background-color: #0b141a; background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
        
        .message { max-width: 75%; padding: 6px 10px 8px 12px; border-radius: 7.5px; font-size: 14.2px; word-wrap: break-word; position: relative; line-height: 19px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .message.incoming { background: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
        .message.outgoing { background: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
        .message .sender { font-size: 12.5px; font-weight: 600; color: #53bdeb; margin-bottom: 2px; display: block; }
        .message .time { font-size: 11px; color: #8696a0; float: right; margin-left: 12px; margin-top: 4px; }

        .chat-input-area { padding: 10px 16px; background: #202c33; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 16px; border-radius: 8px; border: none; background: #2a3942; color: #fff; outline: none; font-size: 15px; }
        .send-btn { background: #00a884; border: none; color: #111b21; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }

        @media (min-width: 768px) {
            .app-container { display: flex !important; }
            .chat-area { position: relative; transform: none !important; }
            .bottom-nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>WhatsApp</h2>
            <input type="text" id="usernameInput" placeholder="Digite seu nome..." autocomplete="off">
            <button id="loginBtn">Avançar</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="wa-header">
                <span class="wa-title"><i class="fa-solid fa-circle-user" style="font-size: 28px; color: #aebac1;"></i></span>
                <div class="wa-header-icons">
                    <i class="fa-solid fa-users"></i>
                    <i class="fa-solid fa-message"></i>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>

            <!-- ABA DE CONVERSAS -->
            <div id="tab-chats" class="tab-pane active">
                <div class="chat-item" onclick="abrirChat()">
                    <div class="chat-avatar"><i class="fa-solid fa-users"></i></div>
                    <div class="chat-info">
                        <div class="chat-name">Grupo Geral</div>
                        <div class="chat-preview" id="lastMessagePreview">Toque para ver mensagens...</div>
                    </div>
                </div>
            </div>

            <!-- ABA DE CONTATOS -->
            <div id="tab-contacts" class="tab-pane">
                <div style="padding: 20px; color: #8696a0; font-size: 15px;">
                    <p style="margin-bottom: 10px; font-weight: bold; color: #e9edef;">Contatos Disponíveis</p>
                    <div class="chat-item" onclick="abrirChat()" style="border: none; padding: 8px 0;">
                        <div class="chat-avatar" style="width: 40px; height: 40px; font-size: 16px;"><i class="fa-solid fa-user"></i></div>
                        <div class="chat-info">
                            <div class="chat-name" id="displayUsername">Participante</div>
                            <div class="chat-preview">Disponível no chat</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
            <div class="bottom-nav">
                <div class="nav-item active" id="navChats" onclick="mudarAba('chats')">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>Conversas</span>
                </div>
                <div class="nav-item" id="navContacts" onclick="mudarAba('contacts')">
                    <i class="fa-solid fa-address-book"></i>
                    <span>Contatos</span>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-topbar">
                <div class="chat-topbar-left">
                    <button onclick="fecharChat()" style="background:none; border:none; color:#aebac1; font-size:20px; cursor:pointer; display:flex; align-items:center;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div style="width:40px; height:40px; border-radius:50%; background:#00a884; color:#111b21; display:flex; align-items:center; justify-content:center; font-size:18px;"><i class="fa-solid fa-users"></i></div>
                        <div>
                            <div style="font-size:16px; font-weight:500; color:#e9edef;">Grupo Geral</div>
                            <div style="font-size:12px; color:#8696a0;">toque aqui para info do grupo</div>
                        </div>
                    </div>
                </div>
                <div class="wa-header-icons">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>
            
            <div class="messages-container" id="messages"></div>
            
            <div class="chat-input-area">
                <i class="fa-regular fa-face-smile" style="color:#8696a0; font-size:22px; cursor:pointer;"></i>
                <i class="fa-solid fa-plus" style="color:#8696a0; font-size:20px; cursor:pointer;"></i>
                <input type="text" id="messageInput" placeholder="Digite uma mensagem" autocomplete="off">
                <button class="send-btn" id="sendMsgBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let usuarioAtual = '';

        document.getElementById('loginBtn').addEventListener('click', executarLogin);
        document.getElementById('usernameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') executarLogin(); });

        document.getElementById('sendMsgBtn').addEventListener('click', enviarTexto);
        document.getElementById('messageInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarTexto(); });

        function executarLogin() {
            const val = document.getElementById('usernameInput').value.trim();
            if (!val) return alert('Digite seu nome!');
            usuarioAtual = val;
            document.getElementById('displayUsername').textContent = usuarioAtual;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';

            carregarMensagens();
            setInterval(carregarMensagens, 2000);
        }

        function mudarAba(aba) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (aba === 'chats') {
                document.getElementById('tab-chats').classList.add('active');
                document.getElementById('navChats').classList.add('active');
            } else if (aba === 'contacts') {
                document.getElementById('tab-contacts').classList.add('active');
                document.getElementById('navContacts').classList.add('active');
            }
        }

        function abrirChat() { document.getElementById('appContainer').classList.add('chat-ativo'); }
        function fecharChat() { document.getElementById('appContainer').classList.remove('chat-ativo'); }

        async function carregarMensagens() {
            try {
                const res = await fetch('/api/chat');
                const msgs = await res.json();
                const container = document.getElementById('messages');
                container.innerHTML = '';

                msgs.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message ' + (msg.sender === usuarioAtual ? 'outgoing' : 'incoming');
                    
                    const sender = document.createElement('span');
                    sender.className = 'sender';
                    sender.textContent = msg.sender;
                    div.appendChild(sender);

                    const textSpan = document.createElement('span');
                    textSpan.textContent = msg.text;
                    div.appendChild(textSpan);

                    const time = document.createElement('span');
                    time.className = 'time';
                    time.textContent = msg.time || '';
                    div.appendChild(time);

                    container.appendChild(div);

                    document.getElementById('lastMessagePreview').textContent = `${msg.sender}: ${msg.text}`;
                });

                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error(err);
            }
        }

        async function enviarTexto() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            input.value = '';
            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: usuarioAtual, text: text, time: horaFormatada })
                });
                carregarMensagens();
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
