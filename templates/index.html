<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body style="margin:0;font-family:Arial;background:#fff">
<div id="login" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<h1 style="color:#128c7e;margin:0;font-size:40px">Plugadoz</h1>
<p style="color:#666">Digite seu nome para entrar</p>
<input id="nomeInput" placeholder="Seu nome" style="padding:14px 18px;border-radius:28px;border:1px solid #ddd;width:90%;max-width:320px;font-size:16px">
<button type="button" id="btnEntrar" style="margin-top:14px;background:#25d366;color:#fff;border:0;padding:14px 0;border-radius:28px;width:90%;max-width:320px;font-size:18px;font-weight:700">Entrar</button>
</div>

<div id="app" style="display:none">
<div style="padding:12px;display:flex;justify-content:space-between"><b style="color:#128c7e;font-size:22px">WhatsApp</b><span>📷 ⋮</span></div>
<div style="background:#f0f2f5;margin:0 12px;padding:10px 14px;border-radius:20px">🔍 Pesquisar</div>
<div style="padding:12px;text-align:center;color:#666;margin-top:60px">Nenhuma conversa ainda<br>Clique no + para entrar no chat</div>
<div onclick="abrir()" style="position:fixed;right:18px;bottom:80px;background:#25d366;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px">+</div>
<div style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;font-size:11px"><div>💬 Conversas</div><div>◍ Atualizações</div><div>👥 Comunidades</div><div>📞 Ligações</div></div>
</div>

<div id="chat" style="position:fixed;inset:0;background:#efeae2;display:none;flex-direction:column;z-index:100">
<div style="background:#008069;color:#fff;padding:10px;display:flex;gap:10px;align-items:center"><span onclick="fechar()" style="font-size:24px">←</span><b>Grupo Plugadoz</b></div>
<div id="msgs" style="flex:1;overflow:auto;padding:12px"></div>
<div style="background:#f0f2f5;padding:8px;display:flex;gap:6px"><input id="mInput" placeholder="Mensagem" style="flex:1;padding:12px;border-radius:22px;border:0"><button onclick="enviar()" style="background:#25d366;border:0;width:44px;height:44px;border-radius:50%;color:#fff">➤</button></div>
</div>

<script>
var meuNome="";
var socket;
try{socket=io();}catch(e){}

function entrar(){
 var v=document.getElementById('nomeInput').value.trim();
 if(!v){alert('Digite seu nome');return;}
 meuNome=v;
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='block';
}
document.getElementById('btnEntrar').addEventListener('click', entrar);
document.getElementById('nomeInput').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });

function abrir(){ document.getElementById('chat').style.display='flex'; }
function fechar(){ document.getElementById('chat').style.display='none'; }
function enviar(){
 var i=document.getElementById('mInput'); if(!i.value) return;
 var dados={nome:meuNome,texto:i.value,hora:new Date().toLocaleTimeString().slice(0,5)};
 add(dados);
 if(socket) socket.emit('mensagem', dados);
 i.value='';
}
function add(d){
 var m=document.getElementById('msgs');
 var div=document.createElement('div');
 div.style.cssText="max-width:75%;padding:8px 10px;border-radius:8px;margin-bottom:8px;background:"+(d.nome===meuNome?"#d9fdd3":"#fff")+";margin-left:"+(d.nome===meuNome?"auto":"0")+";box-shadow:0 1px 1px rgba(0,0,0,.2)";
 div.innerHTML="<b>"+d.nome+"</b><br>"+(d.texto||"")+"<div style='font-size:10px;color:#666;text-align:right'>"+(d.hora||"")+"</div>";
 m.appendChild(div); m.scrollTop=9999;
}
if(socket){
 socket.on('historico', function(h){ document.getElementById('msgs').innerHTML=''; h.forEach(add); });
 socket.on('nova_mensagem', add);
}
</script>
</body>
</html>
