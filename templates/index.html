<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plugadoz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: Segoe UI, Helvetica, Arial, sans-serif}
body{background:#111b21;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:62px;background:#202c33;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#e9edef;flex-shrink:0}
.top b{font-size:19px}
.top small{color:#8696a0;font-size:13px}
.content{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;display:none;flex-direction:column}
.tab.active{display:flex}
#conversasTab{background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');}
.grupos-bar{background:#111b21;padding:8px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0}
.grupo-chip{padding:8px 14px;border-radius:20px;background:#202c33;color:#e9edef;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid #2a3942}
.grupo-chip.active{background:#00a884;color:#111b21;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:6px 8px 20px 8px;border-radius:8px;position:relative;font-size:14.5px;line-height:1.3;word-break:break-word}
.msg.sent{align-self:flex-end;background:#005c4b;color:#e9edef;border-top-right-radius:0}
.msg.received{align-self:flex-start;background:#202c33;color:#e9edef;border-top-left-radius:0}
.msg b{font-size:11px;color:#00a884;display:block}
.hora{position:absolute;right:6px;bottom:3px;font-size:11px;color:#ffffff99}
.msg img.chat-img{width:100%;max-width:240px;border-radius:8px;margin-top:5px;display:block}
.msg audio{width:200px;margin-top:6px}
.input-area{background:#202c33;padding:7px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.input-area input[type=text]{flex:1;padding:12px 14px;border-radius:22px;border:none;background:#2a3942;color:#fff;outline:none}
.btn{width:44px;height:44px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.btn.recording{background:#f15c6d;animation:pulse 1s infinite}
.btn.sec{background:#2a3942}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#statusGravando{font-size:12px;color:#ff5b6e;padding:0 14px 4px 14px;display:none}
.statusTab{background:#111b21;overflow-y:auto;padding:14px}
.statusTab input,.statusTab textarea{width:100%;padding:12px;border-radius:8px;border:none;background:#202c33;color:#fff;outline:none;margin-bottom:10px}
.statusTab button{width:100%;padding:13px;border-radius:8px;border:none;background:#00a884;color:#111b21;font-weight:bold;font-size:15px;cursor:pointer}
.card{background:#202c33;border-radius:10px;padding:12px;margin-bottom:10px;color:#e9edef}
.card img{width:100%;border-radius:8px;margin-top:8px;max-height:350px;object-fit:cover}
.profile-pic{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#2a3942;display:block;margin:10px auto}
.bottom{height:66px;background:#202c33;display:flex;border-top:1px solid #222d34;flex-shrink:0}
.bottom div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8696a0;font-size:11px;cursor:pointer}
.bottom div.active{color:#00a884}
.bottom div span{font-size:22px;margin-bottom:2px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top">
  <div><b id="topTitle">Plugadoz</b><br><small id="topSub">toque em 🎤 e segure para áudio</small></div>
  <div style="display:flex;gap:12px;align-items:center">
    <span style="font-size:22px;cursor:pointer" onclick="criarGrupo()">➕</span>
    <img id="topAvatar" src="https://i.pravatar.cc/100" style="width:38px;height:38px;border-radius:50%">
  </div>
</div>

<div class="content">
  <!-- CONVERSAS -->
  <div id="conversasTab" class="tab active">
    <div class="grupos-bar" id="gruposBar"></div>
    <div id="statusGravando">● gravando... solte para enviar</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <label class="btn sec" style="cursor:pointer">📷<input type="file" id="inputFoto" accept="image/*" class="hidden"></label>
      <input id="input" type="text" placeholder="Digite uma mensagem" autocomplete="off">
      <button id="btnMic" class="btn">🎤</button>
      <button id="btnSend" class="btn hidden">➤</button>
    </div>
  </div>

  <!-- STATUS -->
  <div id="statusTab" class="tab statusTab">
    <h3 style="color:#00a884;margin-bottom:8px">Criar Status</h3>
    <textarea id="statusText" placeholder="Escreva seu status..." rows="3"></textarea>
    <label style="display:block;background:#202c33;padding:12px;border-radius:8px;margin-bottom:10px;text-align:center;color:#8696a0;cursor:pointer">📷 Escolher foto do status<input type="file" id="statusFoto" accept="image/*" class="hidden"></label>
    <img id="previewStatus" class="hidden" style="width:100%;border-radius:10px;margin-bottom:10px;max-height:300px;object-fit:cover">
    <button onclick="publicarStatus()">Publicar Status</button>
    <div id="listaStatus" style="margin-top:18px"></div>
  </div>

  <!-- CONTATOS -->
  <div id="contatosTab" class="tab statusTab">
    <h3 style="color:#00a884">Grupos</h3>
    <p style="color:#8696a0;font-size:13px;margin:8px 0 12px 0">Crie grupos e converse em tempo real</p>
    <div id="listaContatos"></div>
    <button onclick="criarGrupo()" style="margin-top:15px">+ Criar Novo Grupo</button>
  </div>

  <!-- AJUSTES / PERFIL -->
  <div id="ajustesTab" class="tab statusTab">
    <h3 style="color:#00a884">Editar Perfil</h3>
    <img id="perfilFoto" class="profile-pic" src="https://i.pravatar.cc/200">
    <label style="display:block;text-align:center;color:#00a884;cursor:pointer;margin-bottom:12px">Trocar foto<input type="file" id="inputPerfilFoto" accept="image/*" class="hidden"></label>
    <input id="perfilNome" placeholder="Seu nome">
    <input id="perfilRecado" placeholder="Seu recado">
    <button onclick="salvarPerfil()">Salvar Perfil</button>
    <div class="card" style="margin-top:20px;color:#8696a0;font-size:12px">Seu Plugadoz está rodando no Render. Fotos e áudios são em base64 e ficam na memória.</div>
  </div>
</div>

<div class="bottom">
  <div onclick="mudarTab('conversasTab', this)" class="active"><span>💬</span>Conversas</div>
  <div onclick="mudarTab('statusTab', this)"><span>⭕</span>Status</div>
  <div onclick="mudarTab('contatosTab', this)"><span>👥</span>Contatos</div>
  <div onclick="mudarTab('ajustesTab', this)"><span>⚙️</span>Ajustes</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
let nome = localStorage.getItem('plugadoz_nome') || '';
let recado = localStorage.getItem('plugadoz_recado') || 'Disponível';
let avatar = localStorage.getItem('plugadoz_avatar') || 'https://i.pravatar.cc/200?u='+Math.random();
if(!nome){ nome = prompt('Seu nome:') || 'Anônimo'; localStorage.setItem('plugadoz_nome', nome); }
document.getElementById('perfilNome').value = nome;
document.getElementById('perfilRecado').value = recado;
document.getElementById('perfilFoto').src = avatar;
document.getElementById('topAvatar').src = avatar;

let grupoAtual = 'Grupo Geral';
let statusFotoBase64 = '';
let chatFotoBase64 = '';

// TABS
function mudarTab(id, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.bottom div').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('topTitle').textContent = id==='conversasTab'? grupoAtual : id==='statusTab'? 'Status' : id==='contatosTab'? 'Contatos' : 'Ajustes';
}

// GRUPOS
function renderGrupos(lista){
  const bar = document.getElementById('gruposBar');
  const contatos = document.getElementById('listaContatos');
  bar.innerHTML=''; contatos.innerHTML='';
  lista.forEach(g=>{
    const chip = document.createElement('div');
    chip.className='grupo-chip'+(g===grupoAtual?' active':'');
    chip.textContent=g;
    chip.onclick=()=>{ grupoAtual=g; socket.emit('entrar_grupo', g); document.getElementById('topTitle').textContent=g; renderGrupos(lista); document.getElementById('messages').innerHTML=''; };
    bar.appendChild(chip);
    const card = document.createElement('div'); card.className='card'; card.innerHTML=`<b>${g}</b><br><small style="color:#8696a0">clique para entrar</small>`; card.onclick=()=>{ mudarTab('conversasTab', document.querySelector('.bottom div')); grupoAtual=g; socket.emit('entrar_grupo', g); document.getElementById('topTitle').textContent=g; renderGrupos(lista); document.getElementById('messages').innerHTML=''; }; contatos.appendChild(card);
  });
}
function criarGrupo(){
  const n = prompt('Nome do novo grupo:');
  if(n) socket.emit('criar_grupo', n);
}
socket.on('grupos_atualizados', renderGrupos);

// MENSAGENS
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('input');
const btnMic = document.getElementById('btnMic');
const btnSend = document.getElementById('btnSend');

function addMsg(data){
  if(data.grupo && data.grupo!==grupoAtual && data.usuario!==nome) return; // não mostra de outro grupo
  const msgObj = data.mensagem || data;
  const div = document.createElement('div');
  div.className = (msgObj.usuario===nome)? 'msg sent' : 'msg received';
  let html = `<b>${msgObj.usuario}</b>`;
  if(msgObj.texto) html += `<div>${msgObj.texto}</div>`;
  if(msgObj.imagem) html += `<img class="chat-img" src="${msgObj.imagem}">`;
  if(msgObj.audio) html += `<audio controls src="${msgObj.audio}"></audio>`;
  html += `<span class="hora">${msgObj.hora||''}</span>`;
  div.innerHTML = html;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
socket.on('historico', msgs=>{ messagesDiv.innerHTML=''; msgs.forEach(addMsg); });
socket.on('nova_mensagem', d=>{ if(d.grupo===grupoAtual) addMsg(d.mensagem); });
input.addEventListener('input', ()=>{
  if(input.value.trim()){ btnMic.classList.add('hidden'); btnSend.classList.remove('hidden'); }
  else{ btnMic.classList.remove('hidden'); btnSend.classList.add('hidden'); }
});
function enviar(){
  if(!input.value.trim() &&!chatFotoBase64) return;
  const payload = {usuario:nome, avatar:avatar, texto:input.value, imagem: chatFotoBase64 || '', grupo: grupoAtual};
  socket.emit('mensagem', payload);
  input.value=''; chatFotoBase64=''; btnMic.classList.remove('hidden'); btnSend.classList.add('hidden');
}
btnSend.onclick=enviar;
input.addEventListener('keypress', e=>{ if(e.key==='Enter') enviar(); });

// FOTO CHAT
document.getElementById('inputFoto').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader(); reader.onload=()=>{ chatFotoBase64=reader.result; enviar(); }; reader.readAsDataURL(file);
});

// STATUS
function publicarStatus(){
  const texto = document.getElementById('statusText').value;
  if(!texto &&!statusFotoBase64) return alert('Escreva algo ou escolha foto');
  socket.emit('novo_status', {usuario:nome, avatar:avatar, texto:texto, imagem: statusFotoBase64});
  document.getElementById('statusText').value=''; statusFotoBase64=''; document.getElementById('previewStatus').classList.add('hidden');
}
function addStatus(data){
  const div = document.createElement('div'); div.className='card';
  div.innerHTML=`<div style="display:flex;gap:10px;align-items:center"><img src="${data.avatar||'https://i.pravatar.cc/100'}" style="width:38px;height:38px;border-radius:50%"><div><b>${data.usuario}</b><br><small style="color:#8696a0">${data.hora}</small></div></div><div style="margin-top:10px">${data.texto||''}</div>${data.imagem?`<img src="${data.imagem}">`:''}`;
  document.getElementById('listaStatus').prepend(div);
}
socket.on('status_novo', addStatus);
socket.on('historico_status', lista=>{ document.getElementById('listaStatus').innerHTML=''; lista.forEach(addStatus); });
document.getElementById('statusFoto').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=()=>{ statusFotoBase64=r.result; document.getElementById('previewStatus').src=r.result; document.getElementById('previewStatus').classList.remove('hidden'); }; r.readAsDataURL(file);
});

// PERFIL
document.getElementById('inputPerfilFoto').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ avatar=r.result; localStorage.setItem('plugadoz_avatar', avatar); document.getElementById('perfilFoto').src=avatar; document.getElementById('topAvatar').src=avatar; }; r.readAsDataURL(f);
});
function salvarPerfil(){
  nome=document.getElementById('perfilNome').value||'Anônimo';
  recado=document.getElementById('perfilRecado').value||'Disponível';
  localStorage.setItem('plugadoz_nome', nome);
  localStorage.setItem('plugadoz_recado', recado);
  alert('Perfil salvo!');
  document.getElementById('topAvatar').src=avatar;
}

// AUDIO - SEGURA PRA GRAVAR
let mediaRecorder, audioChunks=[], isRecording=false;
const statusGravando=document.getElementById('statusGravando');
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream); audioChunks=[];
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const reader=new FileReader(); reader.readAsDataURL(blob);
      reader.onloadend=()=>{ socket.emit('mensagem',{usuario:nome, avatar:avatar, audio:reader.result, grupo:grupoAtual}); };
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start(); isRecording=true; btnMic.classList.add('recording'); statusGravando.style.display='block';
  }catch(err){ alert('Permita o microfone'); }
}
function stopRec(){ if(mediaRecorder&&isRecording){ mediaRecorder.stop(); isRecording=false; btnMic.classList.remove('recording'); statusGravando.style.display='none'; } }
btnMic.addEventListener('mousedown', startRec); btnMic.addEventListener('mouseup', stopRec); btnMic.addEventListener('mouseleave', stopRec);
btnMic.addEventListener('touchstart', e=>{ e.preventDefault(); startRec(); }); btnMic.addEventListener('touchend', e=>{ e.preventDefault(); stopRec(); });
</script>
</body>
</html>
