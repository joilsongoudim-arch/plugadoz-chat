<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plugadoz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; background: #0b141a; color: #e9edef; overflow: hidden; position: fixed; }

        /* TELA DE LOGIN */
        #login-screen { 
            position: fixed; inset: 0; background: #111b21; display: flex; 
            justify-content: center; align-items: center; z-index: 99999; padding: 20px; 
        }
        .login-card { 
            background: #202c33; padding: 30px 20px; border-radius: 12px; 
            width: 100%; max-width: 340px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
        }
        .login-card h2 { color: #00a884; margin-bottom: 20px; font-size: 24px; }
        .login-card input { 
            width: 100%; padding: 12px 15px; background: #2a3942; border: 1px solid #374248; 
            border-radius: 8px; color: #fff; margin-bottom: 20px; outline: none; font-size: 15px; 
        }
        .login-card button { 
            width: 100%; padding: 12px; background: #00a884; color: #111b21; 
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; 
        }

        /* LAYOUT PRINCIPAL */
        .app-container { display: none; width: 100%; height: 100%; position: relative; }
        .sidebar { width: 100%; max-width: 400px; background: #111b21; border-right: 1px solid #2a3942; display: flex; flex-direction: column; height: 100%; }
        
        .wa-header { padding: 10px 15px; background: #111b21; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; height: 60px; }
        .wa-title { font-size: 22px; font-weight: bold; color: #00a884; display: flex; align-items: center; gap: 8px; }
        .wa-header-icons { display: flex; align-items: center; gap: 22px; color: #aebac1; font-size: 18px; }
        .wa-header-icons i { cursor: pointer; }
        
        .tab-content { flex: 1; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222d34; cursor: pointer; }
        .chat-item:hover { background: #202c33; }
        .chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; font-size: 20px; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 500; color: #e9edef; font-size: 16px; margin-bottom: 3px; }
        .chat-preview { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-section { padding: 15px; }
        .my-status { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; cursor: pointer; }
        .status-avatar { width: 48px; height: 48px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
        .status-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222d34; cursor: pointer; }

        .bottom-nav { display: flex; justify-content: space-around; background: #111b21; border-top: 1px solid #222d34; padding: 10px 0; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8696a0; font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #00a884; font-weight: bold; }

        /* ÁREA DE CHAT */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; width: 100%; }
        .chat-topbar { padding: 10px 15px; background: #202c33; color: #e9edef; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; height: 60px; }
        .chat-topbar-left { display: flex; align-items: center; gap: 12px; }
        
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; position: relative; line-height: 1.4; }
        .message.incoming { background: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
        .message.outgoing { background: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
        .message .sender { font-size: 11px; font-weight: bold; color: #53bdeb; margin-bottom: 3px; display: block; }

        .chat-input-area { padding: 8px 12px; background: #202c33; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; font-size: 14px; }
        .send-btn { background: #00a884; border: none; color: #111b21; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }

        @media (max-width: 768px) {
            .chat-area { display: none; }
            .app-container.chat-ativo .sidebar { display: none; }
            .app-container.chat-ativo .chat-area { display: flex; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Plugadoz</h2>
            <input type="text" id="usernameInput" placeholder="Seu nome..." autocomplete="off">
            <button id="loginBtn">Entrar</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="wa-header">
                <span class="wa-title">Plugadoz</span>
                <div class="wa-header-icons">
                    <i class="fa-solid fa-magnifying-glass" title="Pesquisar"></i>
                    <i class="fa-solid fa-ellipsis-vertical" title="Mais opções"></i>
                </div>
            </div>

            <div id="tab-chats" class="tab-content active">
                <div class="chat-item" onclick="abrirChat()">
                    <div class="chat-avatar"><i class="fa-solid fa-users"></i></div>
                    <div class="chat-info">
                        <div class="chat-name">ITABOA NOTÍCIAS 2026</div>
                        <div class="chat-preview" id="lastMessagePreview">Toque para abrir a conversa...</div>
                    </div>
                </div>
            </div>

            <div id="tab-status" class="tab-content">
                <div class="status-section">
                    <h4 style="color: #00a884; margin-bottom: 10px; font-size: 14px;">Atualizações recentes</h4>
                    <div id="statusList"></div>
                </div>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" onclick="trocarTab('chats', this)">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>Conversas</span>
                </div>
                <div class="nav-item" onclick="trocarTab('status', this)">
                    <i class="fa-solid fa-circle-notch"></i>
                    <span>Atualizações</span>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-topbar">
                <div class="chat-topbar-left">
                    <button onclick="fecharChat()" style="background:none; border:none; color:#00a884; font-size:20px; cursor:pointer;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:36px; height:36px; border-radius:50%; background:#00a884; color:#111b21; display:flex; align-items:center; justify-content:center; font-size:16px;"><i class="fa-solid fa-users"></i></div>
                        <span style="font-size:16px; font-weight:500;">ITABOA NOTÍCIAS 2026</span>
                    </div>
                </div>
            </div>
            
            <div class="messages-container" id="messages"></div>
            
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Mensagem" autocomplete="off">
                <button class="send-btn" id="sendMsgBtn" title="Enviar">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let usuarioAtual = '';

        document.getElementById('loginBtn').addEventListener('click', executarLogin);
        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') executarLogin();
        });

        document.getElementById('sendMsgBtn').addEventListener('click', enviarTexto);
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') enviarTexto();
        });

        function executarLogin() {
            const inputVal = document.getElementById('usernameInput').value.trim();
            if (!inputVal) {
                alert('Por favor, digite seu nome.');
                return;
            }

            usuarioAtual = inputVal;

            // Remove a tela de login instantaneamente e exibe o app
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';

            // Inicia a sincronização de mensagens
            carregarMensagens();
            setInterval(carregarMensagens, 2000); // Atualiza a cada 2 segundos
        }

        function trocarTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            el.classList.add('active');
        }

        function abrirChat() { document.getElementById('appContainer').classList.add('chat-ativo'); }
        function fecharChat() { document.getElementById('appContainer').classList.remove('chat-ativo'); }

        async function carregarMensagens() {
            try {
                const res = await fetch('/api/mensagens');
                const msgs = await res.json();
                
                const container = document.getElementById('messages');
                container.innerHTML = '';
                
                msgs.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message ' + (msg.sender === usuarioAtual ? 'outgoing' : 'incoming');
                    
                    const senderSpan = document.createElement('span');
                    senderSpan.className = 'sender';
                    senderSpan.textContent = msg.sender;
                    div.appendChild(senderSpan);

                    const textNode = document.createTextNode(msg.text);
                    div.appendChild(textNode);
                    
                    container.appendChild(div);

                    // Atualiza o preview da conversa na lista lateral
                    document.getElementById('lastMessagePreview').textContent = `${msg.sender}: ${msg.text}`;
                });
            } catch (err) {
                console.error("Erro ao buscar mensagens", err);
            }
        }

        async function enviarTexto() {
            const input = document.getElementById('messageInput');
            const texto = input.value.trim();
            if (!texto) return;

            const novaMensagem = { sender: usuarioAtual, text: texto };
            
            input.value = '';

            try {
                await fetch('/api/mensagens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novaMensagem)
                });
                carregarMensagens();
            } catch (err) {
                console.error("Erro ao enviar mensagem", err);
            }
        }
    </script>
</body>
                        </html>
