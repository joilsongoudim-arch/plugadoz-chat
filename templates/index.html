<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugadoz Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { padding: 15px 20px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { margin: 0; color: #00d2ff; font-size: 18px; }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; }
        .logout-btn:hover { background: #cc0000; }
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #2a2a2a; padding: 10px 15px; border-radius: 8px; max-width: 80%; word-break: break-word; }
        .message strong { color: #00d2ff; display: block; margin-bottom: 3px; font-size: 13px; }
        .chat-input-area { padding: 15px; background: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 1px solid #333; border-radius: 5px; background: #2a2a2a; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #00d2ff; border: none; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b0d8; }
    </style>
</head>
<body>

    <div class="chat-header">
        <h2>Plugadoz Chat 💬</h2>
        <a href="/logout" class="logout-btn">Sair</a>
    </div>

    <div id="mensagens" class="chat-messages">
        <!-- As mensagens aparecem aqui -->
    </div>

    <div class="chat-input-area">
        <input type="text" id="mensagem-input" placeholder="Digite sua mensagem..." autocomplete="off">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        const socket = io();

        document.getElementById('mensagem-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensagem();
        });

        function enviarMensagem() {
            const input = document.getElementById('mensagem-input');
            const mensagem = input.value.trim();
            if (mensagem !== '') {
                socket.emit('enviar_mensagem', { mensagem: mensagem });
                input.value = '';
            }
        }

        socket.on('receber_mensagem', function(data) {
            const divMensagens = document.getElementById('mensagens');
            const msgElement = document.createElement('div');
            msgElement.classList.add('message');
            msgElement.innerHTML = `<strong>${data.username}</strong> ${data.mensagem}`;
            divMensagens.appendChild(msgElement);
            divMensagens.scrollTop = divMensagens.scrollHeight;
        });
    </script>
</body>
</html>
