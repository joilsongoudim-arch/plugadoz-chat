<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugadoz - Debug</title>
    <style>
        body { background: #111b21; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #202c33; padding: 30px; border-radius: 10px; text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 15px 0; background: #2a3942; border: none; color: #fff; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #00a884; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; color: #111b21; }
        #app { display: none; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-screen" class="box">
        <h2>Entrar no Plugadoz</h2>
        <input type="text" id="nome" placeholder="Digite seu apelido...">
        <button onclick="testarEntrada()">ACESSAR AGORA</button>
    </div>

    <div id="app">
        <h1 style="color: #00a884;">CONECTADO COM SUCESSO!</h1>
        <p id="boas-vindas"></p>
    </div>

    <script>
        function testarEntrada() {
            const valor = document.getElementById('nome').value.trim();
            if (!valor) {
                alert('Por favor, digite um nome!');
                return;
            }
            
            // Esconde o login e mostra o app na hora
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('boas-vindas').innerText = 'Bem-vindo, ' + valor + '!';
        }
    </script>
</body>
</html>
