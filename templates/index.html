<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plugadoz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; background: #111b21; color: #e9edef; overflow: hidden; position: fixed; }

        #login-screen { position: absolute; inset: 0; background: #111b21; display: flex; justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
        .login-card { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .login-card h2 { color: #00a884; margin-bottom: 15px; }
        .login-card input { width: 100%; padding: 12px; background: #2a3942; border: 1px solid #374248; border-radius: 8px; color: #fff; margin-bottom: 15px; outline: none; }
        .avatar-picker { margin-bottom: 15px; text-align: left; }
        .avatar-picker label { font-size: 12px; color: #8696a0; display: block; margin-bottom: 5px; }
        .login-card button { width: 100%; padding: 12px; background: #00a884; color: #111b21; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .app-container { display: flex; width: 100%; height: 100%; position: relative; }
        .sidebar { width: 100%; max-width: 400px; background: #111b21; border-right: 1px solid #2a3942; display: flex; flex-direction: column; height: 100%; }
        
        .wa-header { padding: 15px; background: #111b21; display: flex; justify-content: space-between; align-items: center; }
        .wa-title { font-size: 20px; font-weight: bold; color: #00a884; }
        .user-profile-preview { display: flex; align-items: center; gap: 8px; }
        .user-profile-preview img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

        .tab-content { flex: 1; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222d34; cursor: pointer; }
        .chat-avatar { width: 45px; height: 45px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 500; color: #e9edef; }
        .chat-preview { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Status Tab */
        .status-section { padding: 15px; }
        .my-status { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; cursor: pointer; }
        .status-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #00a884; object-fit: cover; }
        .status-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222d34; }

        .bottom-nav { display: flex; justify-content: space-around; background: #202c33; border-top: 1px solid #2a3942; padding: 10px 0; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8696a0; font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item.active { color: #00a884; font-weight: bold; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; }
        .chat-topbar { padding: 12px 15px; background: #202c33; color: #e9edef; font-weight: bold; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .message.incoming { background: #202c33; align-self: flex-start; }
        .message.outgoing { background: #005c4b; align-self: flex-end; }
        .message .sender { font-size: 11px; font-weight: bold; color: #53bdeb; margin-bottom: 3px; display: block; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .message audio { max-width: 100%; margin-top: 5px; }

        .chat-input-area { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 12px; border-radius: 8px; border: none; background: #2a3942; color: white; outline: none; }
        .action-btn { background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer; padding: 5px; }
        .send-btn { background: #00a884; border: none; color: #111b21; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            .chat-area { display: none; }
            .app-container.chat-ativo .sidebar { display: none; }
            .app-container.chat-ativo .chat-area { display: flex; width: 100%; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>Plugadoz</h2>
            <input type="text" id="usernameInput" placeholder="Seu nome..." autocomplete="off">
            <div class="avatar-picker">
                <label>Foto de Perfil (Opcional):</label>
                <input type="file" id="userAvatarInput" accept="image/*">
            </div>
            <button onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="wa-header">
                <span class="wa-title">Plugadoz</span>
                <div class="user-profile-preview" id="userProfileHeader"></div>
            </div>

            <!-- Tab Conversas -->
            <div id="tab-chats" class="tab-content active">
                <div class="chat-item" onclick="abrirChat()">
                    <div class="chat-avatar">IN</div>
                    <div class="chat-info">
                        <div class="chat-name">ITABOA NOTÍCIAS 2026</div>
                        <div class="chat-preview">Toque para abrir a conversa...</div>
                    </div>
                </div>
            </div>

            <!-- Tab Status -->
            <div id="tab-status" class="tab-content">
                <div class="status-section">
                    <div class="my-status" onclick="document.getElementById('statusFileInput').click()">
                        <img id="myStatusImg" src="https://via.placeholder.com/50" class="status-avatar">
                        <div>
                            <strong>Meu status</strong>
                            <div style="font-size: 12px; color: #8696a0;">Toque para postar uma foto</div>
                        </div>
                    </div>
                    <input type="file" id="statusFileInput" accept="image/*" style="display:none;" onchange="postarStatus(this)">
                    <h4 style="color: #00a884; margin-bottom: 10px;">Atualizações recentes</h4>
                    <div id="statusList"></div>
                </div>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active" onclick="trocarTab('chats', this)">Conversas</div>
                <div class="nav-item" onclick="trocarTab('status', this)">Atualizações</div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-topbar">
                <button onclick="fecharChat()" style="background:none; border:none; color:#00a884; font-size:22px; cursor:pointer;">←</button>
                <span>ITABOA NOTÍCIAS 2026</span>
            </div>
            
            <div class="messages-container" id="messages"></div>
            
            <div class="chat-input-area">
                <button class="action-btn" onclick="document.getElementById('imageFileInput').click()">📷</button>
                <input type="file" id="imageFileInput" accept="image/*" style="display:none;" onchange="enviarImagem(this)">
                
                <button class="action-btn" id="micBtn" onclick="toggleGravacao()">🎙️</button>
                
                <input type="text" id="messageInput" placeholder="Mensagem..." autocomplete="off" onkeypress="if(event.key==='Enter') enviarTexto()">
                <button class="send-btn" onclick="enviarTexto()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        let socket;
        let usuarioAtual = '';
        let fotoPerfilAtual = 'https://via.placeholder.com/50';
        const salaAtual = 'itaboa-geral';
        let mediaRecorder;
        let audioChunks = [];
        let gravando = false;

        function fazerLogin() {
            const nome = document.getElementById('usernameInput').value.trim();
            if (!nome) return alert('Digite seu nome!');
            
            usuarioAtual = nome;
            const avatarFile = document.getElementById('userAvatarInput').files[0];

            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoPerfilAtual = e.target.result;
                    iniciarSessao();
                };
                reader.readAsDataURL(avatarFile);
            } else {
                iniciarSessao();
            }
        }

        function iniciarSessao() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('myStatusImg').src = fotoPerfilAtual;
            document.getElementById('userProfileHeader').innerHTML = `<img src="${fotoPerfilAtual}"><span>${usuarioAtual}</span>`;

            socket = io();
            socket.on('connect', () => socket.emit('join', { room: salaAtual }));
            socket.on('history', (msgs) => {
                document.getElementById('messages').innerHTML = '';
                if(Array.isArray(msgs)) msgs.forEach(renderizarMensagem);
            });
            socket.on('message', renderizarMensagem);
            socket.on('status_list', (list) => {
                document.getElementById('statusList').innerHTML = '';
                if(Array.isArray(list)) list.forEach(renderizarStatus);
            });
            socket.on('new_status', renderizarStatus);
        }

        function trocarTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            el.classList.add('active');
        }

        function abrirChat() { document.getElementById('appContainer').classList.add('chat-ativo'); }
        function fecharChat() { document.getElementById('appContainer').classList.remove('chat-ativo'); }

        function enviarTexto() {
            const input = document.getElementById('messageInput');
            if (!input.value.trim()) return;
            socket.emit('message', { sender: usuarioAtual, text: input.value.trim(), room: salaAtual, type: 'text' });
            input.value = '';
        }

        function enviarImagem(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('message', { sender: usuarioAtual, image: e.target.result, room: salaAtual, type: 'image' });
            };
            reader.readAsDataURL(file);
        }

        async function toggleGravacao() {
            const micBtn = document.getElementById('micBtn');
            if (!gravando) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = e => socket.emit('message', { sender: usuarioAtual, audio: e.target.result, room: salaAtual, type: 'audio' });
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    gravando = true;
                    micBtn.style.color = '#ff4b4b';
                } catch(err) { alert('Permissão de microfone negada.'); }
            } else {
                mediaRecorder.stop();
                gravando = false;
                micBtn.style.color = '#8696a0';
            }
        }

        function postarStatus(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('post_status', { sender: usuarioAtual, avatar: fotoPerfilAtual, image: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        function renderizarMensagem(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (msg.sender === usuarioAtual ? 'outgoing' : 'incoming');
            
            let conteudo = `<span class="sender">${msg.sender}</span>`;
            if (msg.type === 'image' || msg.image) conteudo += `<img src="${msg.image}">`;
            else if (msg.type === 'audio' || msg.audio) conteudo += `<audio controls src="${msg.audio}"></audio>`;
            else conteudo += msg.text || '';
            
            div.innerHTML = conteudo;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderizarStatus(st) {
            const container = document.getElementById('statusList');
            const div = document.createElement('div');
            div.className = 'status-item';
            div.innerHTML = `<img src="${st.avatar}" class="status-avatar"><div><strong>${st.sender}</strong><div style="font-size:12px; color:#8696a0;">Novo status disponível</div></div>`;
            div.onclick = () => {
                const w = window.open("");
                w.document.write(`<body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><img src="${st.image}" style="max-width:100%;max-height:100vh;"></body>`);
            };
            container.appendChild(div);
        }
    </script>
</body>
</html>
