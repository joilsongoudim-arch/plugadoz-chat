<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Plugadoz Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 100%; max-width: 350px; }
        h2 { text-align: center; margin-bottom: 20px; color: #00d2ff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #333; border-radius: 5px; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00b0d8; }
        p { text-align: center; margin-top: 15px; font-size: 14px; }
        a { color: #00d2ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Conta</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Escolha um usuário" required>
            <input type="password" name="password" placeholder="Escolha uma senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem uma conta? <a href="/login">Faça login</a></p>
    </div>
</body>
</html>
